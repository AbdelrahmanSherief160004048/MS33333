<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Team | Manager Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* --- SHARED STYLES --- */
    :root { --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); --sidebar-width: 260px; --glass-bg: rgba(255, 255, 255, 0.95); }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body { background: #e0e5ec; min-height: 100vh; display: flex; }

    /* Sidebar */
    .sidebar { width: var(--sidebar-width); height: 100vh; background: white; border-right: 1px solid #ddd; padding: 30px 20px; position: fixed; display: flex; flex-direction: column; z-index: 10; }
    .logo { font-size: 1.5rem; font-weight: 700; color: #764ba2; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
    .nav-links { list-style: none; flex-grow: 1; }
    .nav-links li { margin-bottom: 10px; }
    .nav-links a { text-decoration: none; color: #666; display: flex; align-items: center; padding: 12px 15px; border-radius: 12px; font-weight: 500; transition: 0.3s; gap: 15px; }
    .nav-links a:hover, .nav-links a.active { background: var(--primary-gradient); color: white; }

    .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); padding: 30px 40px; }

    /* Table */
    .table-container { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { text-align: left; padding: 15px; color: #666; border-bottom: 2px solid #eee; }
    td { padding: 15px; border-bottom: 1px solid #eee; color: #333; vertical-align: middle; }

    .action-btn { background: none; border: none; color: #764ba2; cursor: pointer; font-size: 0.9rem; padding: 5px 15px; border: 1px solid #764ba2; border-radius: 20px; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
    .action-btn:hover { background: #764ba2; color: white; }

    /* MODAL */
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 15px; width: 600px; animation: fadeIn 0.3s; max-height: 90vh; overflow-y: auto; position: relative; }
    .profile-header { text-align: center; margin-bottom: 20px; }
    .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #764ba2; margin-bottom: 10px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
    .info-item label { font-size: 0.8rem; color: #777; font-weight: 600; display: block; }
    .info-item p { font-size: 1rem; color: #333; font-weight: 500; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    .close-modal { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; color: #999; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo"><i class="fas fa-briefcase"></i> GUC HRMS</div>
  <ul class="nav-links">
    <li><a href="/manager-dashboard"><i class="fas fa-home"></i> Overview</a></li>
    <!-- ACTIVE TAB -->
    <li><a href="/manager/team" class="active"><i class="fas fa-users"></i> My Team</a></li>
    <li><a href="#"><i class="fas fa-check-circle"></i> Approvals</a></li>
    <li><a href="#"><i class="fas fa-calendar-alt"></i> Shifts</a></li>
    <li><a href="/login?logout" style="color: red;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
  </ul>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
  <h1 style="margin-bottom: 10px;">My Team</h1>
  <p style="color:#666; margin-bottom: 30px;">Manage and view profiles of your direct reports.</p>

  <div class="table-container">
    <table>
      <thead>
      <tr>
        <th>Photo</th>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody id="teamTableBody">
      <!-- Javascript will load rows here -->
      <tr><td colspan="7" style="text-align: center; padding: 20px;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- VIEW PROFILE MODAL -->
<div id="profileModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">&times;</span>

    <div class="profile-header">
      <img id="viewImg" src="https://via.placeholder.com/100" class="profile-img">
      <h2 id="viewName" style="margin-top: 10px;">-</h2>
      <p id="viewRole" style="color: #764ba2;">Employee</p>
    </div>

    <h4 style="border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; color: #555;">Personal Information</h4>
    <div class="info-grid">
      <div class="info-item"><label>Email</label><p id="viewEmail">-</p></div>
      <div class="info-item"><label>Phone</label><p id="viewPhone">-</p></div>
      <div class="info-item"><label>National ID</label><p id="viewNationalId">-</p></div>
      <div class="info-item"><label>Date of Birth</label><p id="viewDob">-</p></div>
      <div class="info-item"><label>Country</label><p id="viewCountry">-</p></div>
      <div class="info-item"><label>Address</label><p id="viewAddress">-</p></div>
    </div>

    <h4 style="border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; margin-top: 20px; color: #555;">Employment Details</h4>
    <div class="info-grid">
      <div class="info-item"><label>Hire Date</label><p id="viewHireDate">-</p></div>
      <div class="info-item"><label>Status</label><p style="color: green; font-weight: bold;">Active</p></div>
    </div>
  </div>
</div>

<script>
  // 1. Fetch Team Data
  async function loadTeam() {
    // Retrieve the Manager's ID stored during Login
    const managerId = localStorage.getItem("userId");

    if(!managerId) {
      alert("Session expired. Please login again.");
      window.location.href = "/login";
      return;
    }

    try {
      const response = await fetch(`/api/manager/${managerId}/team`);
      const team = await response.json();
      const tbody = document.getElementById('teamTableBody');
      tbody.innerHTML = ''; // Clear loading message

      // Check what data is coming back (Debugging)
      console.log("Team Data:", team);

      if(team.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 20px; color: #888;">No employees found in your team.</td></tr>';
        return;
      }

      team.forEach(emp => {
        // Safely handle null values to prevent "undefined"
        const firstName = emp.firstName || "";
        const lastName = emp.lastName || "";
        const fullName = firstName + " " + lastName;
        const email = emp.email || "-";
        const phone = emp.phone || "-";
        const avatar = emp.profileImage || 'https://via.placeholder.com/100';

        // We must escape quotes in the JSON string so the OnClick function works
        const empData = JSON.stringify(emp).replace(/'/g, "&apos;");

        tbody.innerHTML += `
                    <tr>
                        <td><img src="${avatar}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;"></td>
                        <td>#${emp.id}</td>
                        <td><strong>${fullName}</strong></td>
                        <td>${email}</td>
                        <td>${phone}</td>
                        <td><span style="background:#d4edda; color:#155724; padding:5px 12px; border-radius:15px; font-size:0.8rem; font-weight:600;">Active</span></td>
                        <td>
                            <button class="action-btn" onclick='viewProfile(${empData})'>
                                <i class="fas fa-eye"></i> View Profile
                            </button>
                        </td>
                    </tr>
                `;
      });
    } catch (error) {
      console.error(error);
      document.getElementById('teamTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Error loading data.</td></tr>';
    }
  }

  // 2. Open Modal & Populate Data
  function viewProfile(emp) {
    // Safely set text content
    document.getElementById('viewName').innerText = (emp.firstName || "") + " " + (emp.lastName || "");
    document.getElementById('viewEmail').innerText = emp.email || "-";
    document.getElementById('viewPhone').innerText = emp.phone || "-";
    document.getElementById('viewNationalId').innerText = emp.nationalId || "-";
    document.getElementById('viewDob').innerText = emp.dateOfBirth || "-";
    document.getElementById('viewCountry').innerText = emp.countryOfBirth || "-";
    document.getElementById('viewHireDate').innerText = emp.hireDate || "-";
    // Address isn't in your basic Employee object yet, so we leave it blank or handle it
    document.getElementById('viewAddress').innerText = emp.address || "-";

    // Handle Image
    const img = document.getElementById('viewImg');
    img.src = emp.profileImage ? emp.profileImage : 'https://via.placeholder.com/100';

    // Show Modal
    document.getElementById('profileModal').style.display = 'flex';
  }

  // 3. Close Modal Logic
  function closeModal() {
    document.getElementById('profileModal').style.display = 'none';
  }

  // Close when clicking outside the box
  window.onclick = function(e) {
    if(e.target == document.getElementById('profileModal')) {
      closeModal();
    }
  }

  // Initialize Page
  loadTeam();
</script>

</body>
</html>
