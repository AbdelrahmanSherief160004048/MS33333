<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUC HRMS | Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e0e5ec; overflow: hidden; }

        /* Animation Background */
        .background-shapes { position: absolute; width: 100%; height: 100%; top: 0; left: 0; overflow: hidden; z-index: 0; }
        .shape { position: absolute; filter: blur(70px); opacity: 0.6; animation: float 20s infinite alternate; }
        .shape:nth-child(1) { top: -10%; left: -10%; width: 500px; height: 500px; background: #764ba2; border-radius: 40% 60% 70% 30%; }
        .shape:nth-child(2) { bottom: -10%; right: -5%; width: 400px; height: 400px; background: #667eea; border-radius: 60% 40% 30% 70%; animation-delay: -5s; }
        .shape:nth-child(3) { top: 40%; left: 40%; width: 300px; height: 300px; background: #ff9a9e; border-radius: 30%; animation-duration: 15s; }
        @keyframes float { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(30px, 50px) rotate(20deg); } }

        /* Container */
        .container { position: relative; width: 900px; height: 650px; background: var(--glass-bg); border-radius: 25px; box-shadow: var(--shadow); border: 1px solid var(--glass-border); overflow: hidden; z-index: 1; }
        .form-container { position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out; display: flex; align-items: center; justify-content: center; text-align: center; }
        form { background: transparent; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 40px 50px; overflow-y: auto; scrollbar-width: none; }
        form::-webkit-scrollbar { display: none; }

        h1 { font-weight: 700; color: #333; margin-bottom: 20px; font-size: 2.2rem; flex-shrink: 0; }
        .social-container { margin: 15px 0; flex-shrink: 0; }
        .social-container a { border: 1px solid #ddd; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; margin: 0 8px; height: 45px; width: 45px; color: #333; font-size: 1.1rem; text-decoration: none; transition: 0.3s; background: white; }
        .social-container a:hover { transform: translateY(-3px); border-color: #764ba2; color: #764ba2; }
        span { font-size: 13px; color: #666; margin-bottom: 15px; flex-shrink: 0; }

        /* Inputs */
        .input-group { position: relative; width: 100%; margin: 8px 0; flex-shrink: 0; }
        .input-group input, .input-group select { width: 100%; padding: 12px 20px 12px 45px; background-color: #fff; border: 2px solid #eee; border-radius: 12px; outline: none; font-size: 0.95rem; transition: 0.3s; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none; }
        .input-group input:focus, .input-group select:focus { border-color: #764ba2; }
        .input-group input:focus ~ i, .input-group select:focus ~ i { color: #764ba2; }

        button.action-btn { border-radius: 50px; border: none; background: var(--primary-gradient); color: #FFFFFF; font-size: 14px; font-weight: 600; padding: 14px 50px; letter-spacing: 1px; text-transform: uppercase; margin-top: 20px; margin-bottom: 30px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3); flex-shrink: 0; }
        button.action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4); }
        button.action-btn:active { transform: scale(0.98); }

        /* Slider */
        .sign-in-container { left: 0; width: 50%; z-index: 2; }
        .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; pointer-events: none; }
        .container.right-panel-active .sign-in-container { transform: translateX(100%); opacity: 0; pointer-events: none; }
        .container.right-panel-active .sign-up-container { transform: translateX(100%); opacity: 1; z-index: 5; pointer-events: all; animation: fadeIn 0.6s ease-in-out; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

        /* Overlay */
        .overlay-container { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100; border-radius: 0 0 0 25px; }
        .container.right-panel-active .overlay-container { transform: translateX(-100%); border-radius: 0 25px 0 0; }
        .overlay { background: var(--primary-gradient); color: #FFFFFF; position: relative; left: -100%; height: 100%; width: 200%; transform: translateX(0); transition: transform 0.6s ease-in-out; }
        .container.right-panel-active .overlay { transform: translateX(50%); }
        .overlay-panel { position: absolute; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 40px; text-align: center; top: 0; height: 100%; width: 50%; transform: translateX(0); transition: transform 0.6s ease-in-out; }
        .overlay-panel h1 { color: #fff; }
        .overlay-panel p { font-size: 14px; font-weight: 300; line-height: 24px; margin: 20px 0 30px; }
        button.ghost { background-color: transparent; border: 2px solid #FFFFFF; color: #fff; border-radius: 50px; padding: 12px 45px; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        button.ghost:hover { background: #fff; color: #764ba2; }
        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }
    </style>
</head>
<body>

<div class="background-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<div class="container" id="container">

    <!-- SIGN UP FORM -->
    <div class="form-container sign-up-container">
        <form id="signupForm">
            <h1>Create Account</h1>
            <div class="social-container">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-google"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <span>or use your email for registration</span>

            <div class="input-group"><input type="text" name="firstName" placeholder="First Name" required /><i class="fas fa-user"></i></div>
            <div class="input-group"><input type="text" name="lastName" placeholder="Last Name" required /><i class="fas fa-user"></i></div>
            <div class="input-group"><input type="email" name="email" placeholder="Email" required /><i class="fas fa-envelope"></i></div>
            <div class="input-group"><input type="password" name="password" placeholder="Password" required /><i class="fas fa-lock"></i></div>
            <div class="input-group"><input type="tel" name="phone" placeholder="Phone Number" required /><i class="fas fa-phone"></i></div>
            <div class="input-group"><input type="text" name="nationalId" placeholder="National ID" required /><i class="fas fa-id-card"></i></div>
            <div class="input-group"><input type="text" name="dateOfBirth" placeholder="Date of Birth" onfocus="(this.type='date')" onblur="(this.type='text')" required /><i class="fas fa-calendar-alt"></i></div>
            <div class="input-group"><input type="text" name="countryOfBirth" placeholder="Country of Birth" required /><i class="fas fa-globe"></i></div>

            <div class="input-group">
                <select name="departmentId" required>
                    <option value="" disabled selected>Select Department</option>
                    <option value="1001">IT Department</option>
                    <option value="1002">Human Resources</option>
                    <option value="1003">Finance</option>
                    <option value="1004">Sales</option>
                </select>
                <i class="fas fa-building"></i>
            </div>

            <div class="input-group">
                <select name="roleId" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="7001">HR Administrator</option>
                    <option value="7002">Line Manager</option>
                    <option value="7003">System Admin</option>
                </select>
                <i class="fas fa-briefcase"></i>
            </div>

            <button class="action-btn" type="submit">Sign Up</button>
        </form>
    </div>

    <!-- SIGN IN FORM -->
    <div class="form-container sign-in-container">
        <form id="signinForm">
            <h1>Sign In</h1>
            <div class="social-container">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-google"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <span>or use your account</span>

            <div class="input-group">
                <input type="email" name="email" placeholder="Email" required />
                <i class="fas fa-envelope"></i>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password or National ID" required />
                <i class="fas fa-lock"></i>
            </div>

            <button class="action-btn" type="submit">Sign In</button>
        </form>
    </div>

    <!-- OVERLAY -->
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>To keep connected with us please login with your personal info</p>
                <button class="ghost" id="signIn">Sign In</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>Hello, Friend!</h1>
                <p>Enter your personal details and start your journey with GUC HRMS</p>
                <button class="ghost" id="signUp">Sign Up</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- ANIMATION LOGIC ---
    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.getElementById('container');

    signUpButton.addEventListener('click', () => { container.classList.add("right-panel-active"); });
    signInButton.addEventListener('click', () => { container.classList.remove("right-panel-active"); });

    // --- SIGN UP LOGIC ---
    const signupForm = document.getElementById('signupForm');
    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(signupForm);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                if (result.redirectUrl) window.location.href = result.redirectUrl;
                else alert("Account created! Please Sign In.");
            } else {
                const errorText = await response.text();
                alert("Registration Failed: " + errorText);
            }
        } catch (error) { console.error('Error:', error); alert("Connection Error."); }
    });

    // --- SIGN IN LOGIC (Uses /api/login and saves userId) ---
    const signinForm = document.getElementById('signinForm');
    signinForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(signinForm);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();

                // IMPORTANT: Save userId for Manager/Employee dashboards
                if (result.userId) {
                    localStorage.setItem("userId", result.userId);
                }

                if (result.redirectUrl) {
                    window.location.href = result.redirectUrl;
                }
            } else {
                const errorText = await response.text();
                alert("Login Failed: " + errorText);
            }
        } catch (error) {
            console.error('Error:', error);
            alert("Connection Error.");
        }
    });
</script>

</body>
</html>
