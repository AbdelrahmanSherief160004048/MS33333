<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | GUC HRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); --sidebar-width: 260px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: #e0e5ec; min-height: 100vh; display: flex; }

        .sidebar { width: var(--sidebar-width); height: 100vh; background: white; border-right: 1px solid #ddd; padding: 30px 20px; position: fixed; display: flex; flex-direction: column; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #764ba2; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-links { list-style: none; flex-grow: 1; }
        .nav-links li { margin-bottom: 10px; }
        .nav-links a { text-decoration: none; color: #666; display: flex; align-items: center; padding: 12px 15px; border-radius: 12px; font-weight: 500; transition: 0.3s; gap: 15px; }
        .nav-links a:hover, .nav-links a.active { background: var(--primary-gradient); color: white; }

        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); padding: 30px 40px; }

        /* Profile Card */
        .profile-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }

        .img-wrapper { position: relative; width: 100px; height: 100px; cursor: pointer; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #eee; transition: 0.3s; }
        .img-wrapper:hover .profile-img { opacity: 0.7; }
        .camera-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #333; font-size: 1.5rem; opacity: 0; pointer-events: none; transition: 0.3s; }
        .img-wrapper:hover .camera-icon { opacity: 1; }

        .form-section { margin-bottom: 20px; }
        .form-section h3 { margin-bottom: 15px; color: #764ba2; font-size: 1.1rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; display: inline-block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group label { display: block; font-size: 0.9rem; color: #666; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; }

        /* Disabled input style (Read Only) */
        .form-group input:disabled { background: #f8f9fa; color: #777; cursor: not-allowed; border-color: #eee; }

        .btn-save { background: var(--primary-gradient); color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: 600; cursor: pointer; float: right; margin-top: 20px; box-shadow: 0 4px 10px rgba(118, 75, 162, 0.3); transition: 0.2s; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(118, 75, 162, 0.4); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo"><i class="fas fa-shapes"></i> GUC HRMS</div>
    <ul class="nav-links">
        <li><a href="/employee-dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="/profile" class="active"><i class="fas fa-user-circle"></i> My Profile</a></li>
        <li><a href="#"><i class="fas fa-calendar-alt"></i> Leaves</a></li>
        <li><a href="/login?logout" style="color: red;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="profile-card">
        <div class="profile-header">
            <!-- Click image to upload -->
            <div class="img-wrapper" onclick="document.getElementById('fileInput').click()">
                <img id="profileImg" src="https://via.placeholder.com/100" class="profile-img">
                <i class="fas fa-camera camera-icon"></i>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadProfilePhoto()">

            <div>
                <h2 id="displayName">Loading...</h2>
                <p id="displayRole" style="color: #764ba2; font-weight: 500;">Employee</p>
            </div>
        </div>

        <form id="profileForm">
            <input type="hidden" id="userId" name="id">

            <div class="form-section">
                <h3>Personal Information</h3>
                <div class="form-grid">
                    <!-- Read Only Fields -->
                    <div class="form-group"><label>First Name</label><input type="text" id="firstName" disabled></div>
                    <div class="form-group"><label>Last Name</label><input type="text" id="lastName" disabled></div>
                    <div class="form-group"><label>Email</label><input type="email" id="email" disabled></div>
                    <div class="form-group"><label>National ID</label><input type="text" id="nationalId" disabled></div>

                    <!-- Editable Fields -->
                    <div class="form-group"><label>Phone Number</label><input type="text" id="phone" name="phone"></div>
                    <div class="form-group"><label>Address</label><input type="text" id="address" name="address"></div>
                </div>
            </div>

            <div class="form-section">
                <h3>Emergency Contact</h3>
                <div class="form-grid">
                    <div class="form-group"><label>Contact Name</label><input type="text" id="emergencyName" name="emergencyContactName"></div>
                    <div class="form-group"><label>Contact Phone</label><input type="text" id="emergencyPhone" name="emergencyContactPhone"></div>
                </div>
            </div>

            <button type="submit" class="btn-save">Save Changes</button>
        </form>
    </div>
</div>

<script>
    const userId = localStorage.getItem("userId");

    // 1. Load User Data
    async function loadProfile() {
        if(!userId) { window.location.href = "/login"; return; }

        try {
            const res = await fetch(`/api/employees/${userId}`);
            const user = await res.json();

            // Header
            document.getElementById('displayName').innerText = `${user.firstName} ${user.lastName}`;
            if(user.profileImage) document.getElementById('profileImg').src = user.profileImage;

            // Form Fields
            document.getElementById('userId').value = user.id;
            document.getElementById('firstName').value = user.firstName;
            document.getElementById('lastName').value = user.lastName;
            document.getElementById('email').value = user.email;
            document.getElementById('nationalId').value = user.nationalId || "N/A";

            // Editable Fields
            document.getElementById('phone').value = user.phone || "";
            document.getElementById('address').value = user.address || "";
            document.getElementById('emergencyName').value = user.emergencyContactName || "";
            document.getElementById('emergencyPhone').value = user.emergencyContactPhone || "";

        } catch (e) { console.error(e); }
    }

    // 2. Save Text Changes
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            id: userId,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            emergencyContactName: document.getElementById('emergencyName').value,
            emergencyContactPhone: document.getElementById('emergencyPhone').value
        };

        try {
            const res = await fetch('/api/employees/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) alert("Profile updated successfully!");
            else alert("Failed to save changes.");
        } catch (e) { alert("Connection Error"); }
    });

    // 3. Upload Photo Immediately
    function uploadProfilePhoto() {
        const file = document.getElementById('fileInput').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onloadend = async function() {
                const base64 = reader.result;
                document.getElementById('profileImg').src = base64; // Preview

                // Send to backend
                await fetch('/api/employees/upload-photo', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: userId, image: base64 })
                });
            }
            reader.readAsDataURL(file);
        }
    }

    loadProfile();
</script>

</body>
</html>
