spring.application.name=MS33333

# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Milestone3;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# 1. Do NOT let Hibernate touch the database structure.
# You created tables manually with SQL, so we trust your script.
spring.jpa.hibernate.ddl-auto=none

# 2. CRITICAL: This line fixes the "Invalid object name" error.
# It tells Hibernate: "Do not convert camelCase to snake_case. Use the exact table name I typed."
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 3. Use the correct dialect for SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# 4. Debugging: Show formatted SQL queries in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FILE UPLOAD SETTINGS
# ===============================
# Increase limits if you plan to upload PDF/Images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB